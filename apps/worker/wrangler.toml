name = "weibo-proxy-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
account_id = "768c876155e77e3a6e52a855489a6c8a"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

# Streams 管道配置（替换 YOUR_PIPELINE_ID）
[[pipelines]]
pipeline = "YOUR_PIPELINE_ID"  # 从 Cloudflare Dashboard 复制
binding = "LOGS_STREAM"
