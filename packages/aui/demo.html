<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>@sker/aui Demo - 交互式工具调用</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/rxjs@7/dist/bundles/rxjs.umd.min.js"></script>
  <style>
    body { font-family: system-ui; padding: 20px; max-width: 1200px; margin: 0 auto; }
    pre { background: #f5f5f5; padding: 15px; border-radius: 4px; overflow: auto; white-space: pre-wrap; }
    button { padding: 8px 16px; cursor: pointer; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; }
    button:hover { background: #0056b3; }
    .demo-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    h3 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 5px; }
    .tool-form { background: #fff; padding: 15px; border: 1px solid #ccc; border-radius: 4px; margin: 10px 0; }
    .tool-form input { padding: 8px; margin: 5px; width: 200px; border: 1px solid #ddd; border-radius: 4px; }
    .result { background: #e8f5e9; padding: 10px; border-radius: 4px; margin: 10px 0; }
    .error { background: #ffebee; padding: 10px; border-radius: 4px; margin: 10px 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, createContext, useContext } = React;
    const { BehaviorSubject } = rxjs;

    const auiStore = {
      state$: new BehaviorSubject({ nodes: new Map(), rootIds: [] }),
      registerNode(node) {
        const state = this.state$.value;
        const nodes = new Map(state.nodes);
        const isNew = !nodes.has(node.id);
        nodes.set(node.id, node);
        const rootIds = isNew && !state.rootIds.includes(node.id)
          ? [...state.rootIds, node.id]
          : state.rootIds;
        this.state$.next({ nodes, rootIds });
      },
      unregisterNode(id) {
        const state = this.state$.value;
        const nodes = new Map(state.nodes);
        nodes.delete(id);
        const rootIds = state.rootIds.filter(rid => rid !== id);
        this.state$.next({ nodes, rootIds });
      },
      updateNode(id, updates) {
        const state = this.state$.value;
        const node = state.nodes.get(id);
        if (!node) return;
        const nodes = new Map(state.nodes);
        nodes.set(id, { ...node, ...updates });
        this.state$.next({ ...state, nodes });
      },
      getNode(id) {
        return this.state$.value.nodes.get(id);
      },
      getRootNodes() {
        const { nodes, rootIds } = this.state$.value;
        return rootIds.map(id => nodes.get(id)).filter(Boolean);
      },
    };

    const toolExecutor = {
      async execute(nodeId, params) {
        const node = auiStore.getNode(nodeId);
        const tool = node?.props?.tool;
        if (!tool) return { success: false, error: 'Tool not found' };

        for (const p of tool.parameters || []) {
          if (p.required && params[p.name] === undefined) {
            return { success: false, error: `Missing required: ${p.name}` };
          }
        }

        try {
          const data = await tool.handler(params);
          return { success: true, data };
        } catch (e) {
          return { success: false, error: String(e) };
        }
      }
    };

    const AuiContext = createContext(null);

    function AuiProvider({ children }) {
      return <AuiContext.Provider value={auiStore}>{children}</AuiContext.Provider>;
    }

    function useAuiNode(id, type, props, metadata) {
      const store = useContext(AuiContext);
      useEffect(() => {
        store.registerNode({ id, type, props, metadata });
        return () => store.unregisterNode(id);
      }, [store, id, type, JSON.stringify(props), JSON.stringify(metadata)]);
    }

    function useAuiNaturalContext(pageName) {
      const store = useContext(AuiContext);
      const [context, setContext] = useState('');

      useEffect(() => {
        const sub = store.state$.subscribe(() => {
          const nodes = store.getRootNodes();
          setContext(toNaturalLanguage(nodes, pageName));
        });
        const nodes = store.getRootNodes();
        setContext(toNaturalLanguage(nodes, pageName));
        return () => sub.unsubscribe();
      }, [store, pageName]);

      return context;
    }

    function toNaturalLanguage(nodes, pageName) {
      const visibleNodes = nodes.filter(n => {
        const visible = n.metadata?.visible;
        if (visible === undefined) return true;
        return typeof visible === 'function' ? visible() : visible;
      });

      if (visibleNodes.length === 0) return '当前页面没有可见元素。';

      const lines = [];
      if (pageName) lines.push(`# ${pageName}\n`);

      visibleNodes.forEach((node, i) => {
        let desc = '';
        if (node.type === 'Button' && node.props?.tool) {
          const tool = node.props.tool;
          const label = node.props.label || tool.name;
          const params = tool.parameters?.map(p =>
            `${p.name} (${p.type}${p.required ? ', 必填' : ''}): ${p.description || ''}`
          ).join('\n    - ') || '无参数';
          desc = `按钮 "${label}"（工具：${tool.name}）\n    参数：\n    - ${params}`;
        } else if (node.type === 'Button') {
          const label = node.props?.label || '按钮';
          const importance = node.metadata?.importance === 'high' ? '（重要）' : '';
          desc = `按钮 "${label}"${importance}`;
        } else if (node.type === 'Card') {
          desc = `卡片 "${node.props?.title || '卡片'}"`;
        } else {
          desc = `${node.type} (${node.id})`;
        }
        lines.push(`${i + 1}. ${desc}`);
      });

      return lines.join('\n');
    }

    function ToolButton({ id, label, tool }) {
      const [showForm, setShowForm] = useState(false);
      const [params, setParams] = useState({});
      const [result, setResult] = useState(null);

      useAuiNode(id, 'Button', { label, tool });

      const handleExecute = async () => {
        const res = await toolExecutor.execute(id, params);
        setResult(res);
        if (res.success) {
          setShowForm(false);
          setParams({});
        }
      };

      return (
        <div>
          <button onClick={() => setShowForm(!showForm)}>{label}</button>
          {showForm && (
            <div className="tool-form">
              <h4>工具：{tool.name}</h4>
              {tool.parameters?.map(p => (
                <div key={p.name}>
                  <label>{p.name} ({p.type}{p.required ? ', 必填' : ''}): </label>
                  <input
                    type={p.type === 'number' ? 'number' : 'text'}
                    placeholder={p.description}
                    value={params[p.name] || ''}
                    onChange={e => setParams({ ...params, [p.name]: e.target.value })}
                  />
                </div>
              ))}
              <button onClick={handleExecute}>执行</button>
            </div>
          )}
          {result && (
            <div className={result.success ? 'result' : 'error'}>
              {result.success ? `成功: ${JSON.stringify(result.data)}` : `错误: ${result.error}`}
            </div>
          )}
        </div>
      );
    }

    function DemoContent() {
      const naturalContext = useAuiNaturalContext('Dashboard');

      return (
        <>
          <h1>@sker/aui Demo - 交互式工具调用</h1>

          <div className="demo-section">
            <h3>UI 组件</h3>
            <ToolButton
              id="create-user-btn"
              label="创建用户"
              tool={{
                name: 'createUser',
                description: '创建新用户',
                parameters: [
                  { name: 'name', type: 'string', required: true, description: '用户名' },
                  { name: 'email', type: 'string', required: true, description: '邮箱' },
                  { name: 'age', type: 'number', required: false, description: '年龄' },
                ],
                handler: async (params) => {
                  const user = { id: Date.now(), ...params };
                  auiStore.unregisterNode('create-user-btn');
                  auiStore.registerNode({
                    id: 'user-card',
                    type: 'Card',
                    props: { title: `用户：${params.name} (${params.email})` },
                  });
                  auiStore.registerNode({
                    id: 'edit-user-btn',
                    type: 'Button',
                    props: {
                      label: '编辑用户',
                      tool: {
                        name: 'editUser',
                        parameters: [
                          { name: 'name', type: 'string', description: '新用户名' },
                        ],
                        handler: async (params) => {
                          auiStore.updateNode('user-card', {
                            props: { title: `用户：${params.name}` },
                          });
                          return { updated: true };
                        },
                      },
                    },
                  });
                  return user;
                },
              }}
            />
          </div>

          <div className="demo-section">
            <h3>AI 上下文（Markdown 格式）</h3>
            <pre>{naturalContext}</pre>
          </div>
        </>
      );
    }

    function App() {
      return (
        <AuiProvider>
          <DemoContent />
        </AuiProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
