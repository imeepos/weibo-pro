services:
  nginx:
    image: nginx:alpine
    container_name: weibo-pro-nginx
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./apps/bigscreen/dist:/usr/share/nginx/html:ro
      - ./apps/app/dist:/usr/share/nginx/html/mobile:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
