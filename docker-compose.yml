version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: weibo-pro-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres2025Secure
      POSTGRES_DB: vectordb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weibo-pro-network
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: weibo-pro-redis
    command: redis-server --requirepass Redis2025Complex
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Redis2025Complex", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weibo-pro-network
    restart: unless-stopped

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: weibo-pro-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: RabbitMQ2025Secure
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - weibo-pro-network
    restart: unless-stopped

  # MongoDB 文档数据库
  mongodb:
    image: mongo:7
    container_name: weibo-pro-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: MongoDB2025Secure
      MONGO_INITDB_DATABASE: appdb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weibo-pro-network
    restart: unless-stopped

  # API 服务
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: weibo-pro-api
    environment:
      DATABASE_URL: postgresql://postgres:Postgres2025Secure@postgres:5432/vectordb
      REDIS_URL: redis://:Redis2025Complex@redis:6379
      RABBITMQ_URL: amqp://admin:RabbitMQ2025Secure@rabbitmq:5672
      MONGODB_URL: mongodb://admin:MongoDB2025Secure@mongodb:27017/appdb?authSource=admin
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AMAP_API_KEY: ${AMAP_API_KEY}
      S3_BASE_URL: http://localhost:8089
      API_BASE_URL: http://localhost:8089
      PORT: 8089
      DEV: "false"
      KUAIDAILI_SECRET_ID: ${KUAIDAILI_SECRET_ID}
      KUAIDAILI_SECRET_KEY: ${KUAIDAILI_SECRET_KEY}
      KUAIDAILI_USERNAME: ${KUAIDAILI_USERNAME}
      KUAIDAILI_PASSWORD: ${KUAIDAILI_PASSWORD}
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - weibo-pro-network
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: weibo-pro-nginx
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./apps/bigscreen/dist:/usr/share/nginx/html
      - ./apps/app/dist:/usr/share/nginx/html/mobile
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - weibo-pro-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  mongodb_data:

networks:
  weibo-pro-network:
    driver: bridge
